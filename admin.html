.card{background:var(--card);border:1px solid var(--line);padding:16px}.k{font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}.v{font-size:26px;font-weight:900;letter-spacing:-1px;margin-top:4px}.v.s{font-size:18px}

function prepImage(file,max=1600,quality=.8){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);c.toBlob(b=>b&&b.type==='image/webp'?res(b):c.toBlob(j=>j?res(j):rej(new Error('Could not process image')),'image/jpeg',quality+.04),'image/webp',quality)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('This file is not a readable image'))};im.src=u})}

async function upl(folder,name,blob,onp){if(!fAuth.currentUser)throw new Error('Please sign in again');const isA=/^audio\//.test(blob.type)||/\.mp3$/i.test(name||'');const lim=isA?40:15;if(blob.size>lim*1048576)throw new Error('File is larger than '+lim+' MB');const ref=fStorage.ref(folder+'/'+(name||Date.now()+'-'+Math.random().toString(36).slice(2,8)));const task=ref.put(blob,{contentType:blob.type||(isA?'audio/mpeg':'image/jpeg'),cacheControl:'public,max-age=31536000'});
try{await new Promise((res,rej)=>{let t;const arm=()=>{clearTimeout(t);t=setTimeout(()=>rej(new Error('Upload is not reaching Firebase Storage. In Firebase Console open Storage: make sure it is set up and the rules allow signed-in users to write.')),15000)};arm();task.on('state_changed',sn=>{arm();if(onp)onp(Math.round(sn.bytesTransferred/Math.max(1,sn.totalBytes)*100))},e=>{clearTimeout(t);rej(e)},()=>{clearTimeout(t);res()})});return await ref.getDownloadURL()}catch(e){try{task.cancel()}catch(_){}if(e&&/unauthorized|unauthenticated/.test(e.code||''))throw new Error('Firebase Storage rules are blocking uploads. Allow signed-in admins to write in Storage rules.');throw e}}

function mkCoupon(code,type,value,min){code=code.toUpperCase().trim();if(!/^[A-Z0-9]{3,20}$/.test(code))return'Code must be 3–20 letters or digits';if(S.coupons.some(c=>c.code===code))return code+' already exists';if(type==='pct'&&!(value>0&&value<=100))return'Percent must be 1–100';if(type==='flat'&&!(value>0))return'Enter a value above 0';S.coupons.unshift({code,type,value:+value||0,min:+min||0,on:true,used:0});save();return''}
function newC(){const m=modal(`<h1 style="font-size:22px">New coupon</h1><br><div class="f"><label>Code *</label><input id="c1" style="text-transform:uppercase"></div><div class="r2"><div class="f"><label>Type</label><select id="c2"><option value="pct">Percent off</option><option value="flat">Fixed ₹ off</option><option value="ship">Free shipping</option></select></div><div class="f"><label>Value</label><input id="c3" type="number" min="0"></div></div><div class="f"><label>Minimum order ₹</label><input id="c4" type="number" min="0" value="0"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn o" onclick="close(this)">Cancel</button><button class="btn" id="cgo2">Create</button></div>`,1);m.querySelector('#cgo2').onclick=()=>{const e=mkCoupon(m.querySelector('#c1').value,m.querySelector('#c2').value,+m.querySelector('#c3').value,+m.querySelector('#c4').value);if(e)return toast(e);m.remove();render();toast('Coupon created')}}
function tgC(c){const x=S.coupons.find(y=>y.code===c);x.on=!x.on;save();render()}function delC(c){if(confirm('Delete '+c+'?')){S.coupons=S.coupons.filter(y=>y.code!==c);save();render()}}
function customers(){const m={};S.orders.forEach(o=>{const c=m[o.phone]||(m[o.phone]={name:o.name,phone:o.phone,email:o.email,n:0,spent:0,last:0});c.n++;if(live(o))c.spent+=total(o);c.last=Math.max(c.last,o.at)});const L=Object.values(m).sort((a,b)=>b.spent-a.spent);return`<h1>Customers</h1><p class="lead">Built from your orders (matched by phone number).</p>${L.length?`<div class="tw"><table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Orders</th><th>Spent</th><th>Last order</th></tr>${L.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.email||'—')}</td><td>${c.n}</td><td>${money(c.spent)}</td><td>${fd(c.last)}</td></tr>`).join('')}</table></div>`:'<div class="card empty">Customers appear when you add orders.</div>'}`}
function settings(){return`<h1>Settings</h1><p class="lead">Data is stored in your cloud database and shared across devices.</p><div class="card" style="max-width:560px"><h3>Backup</h3><div class="bar"><button class="btn" onclick="dl('cavalloluxe-admin-backup.json',JSON.stringify(S),'application/json')">Download backup</button><label class="btn o" style="cursor:pointer">Restore backup<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></div><h3 style="margin-top:20px">Account</h3><button class="btn o" onclick="fAuth.signOut().then(()=>location.reload())">Sign out</button></div>`}
function restore(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.products)||!Array.isArray(d.orders))throw 0;S=d;save();go('dashboard');toast('Backup restored')}catch(e){toast('Not a valid backup file')}})}

/* ---------- Content management panels. Saved in this browser; publishing to the separate storefront needs a shared backend. ---------- */
function cmsUpload(file,cb){toast('Uploading…');up1(file,'site-media').then(cb).catch(e=>toast('Upload failed: '+(e.message||e)));return;if(!file)return;const au=file.type.startsWith('audio/');if(au&&file.size>3*1048576)return toast('MP3 is larger than 3 MB.');(au?Promise.resolve(file):prepImage(file,1600,.8)).then(b=>upl('site-media','cms/'+Date.now()+'-'+Math.random().toString(36).slice(2,7),b)).then(cb).catch(e=>toast('Could not add file: '+e.message))}
function cmsField(label,id,value='',type='text',placeholder=''){return `<div class="f"><label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`}
function fileBox(label,idu,idf,accept,val,ph){return `<div class="f"><label>${label}</label><input id="${idu}" type="url" value="${esc(val||'')}" placeholder="${ph||'https://…'}"><input id="${idf}" type="file" accept="${accept}" style="margin-top:6px"></div>`}
function moveCms(k,i,d){const L=S.cms[k],j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];save();render()}
function toggleCms(k,i){S.cms[k][i].on=!S.cms[k][i].on;save();render()}
function music(){const L=S.cms.music;return `<h1>Music Library</h1><p class="lead">Tracks here play in the storefront music player, in this order.</p><div class="bar"><button class="btn" onclick="editMusic()">+ Add track</button><button class="btn o" onclick="refreshData(this)">Reload</button><span class="k">${L.length} tracks</span></div>${L.length?`<div class="tw"><table><tr><th>Cover</th><th>Track</th><th>Audio</th><th>Status</th><th></th></tr>${L.map((x,i)=>`<tr><td>${x.cover?`<img class="pimg" src="${esc(x.cover)}" alt="">`:'<div class="pimg"></div>'}</td><td><b>${esc(x.title)}</b><br><small style="color:var(--muted)">${esc(x.artist||'')}</small></td><td>${x.audio?`<audio controls preload="none" style="width:170px" src="${esc(x.audio)}"></audio>`:'No MP3'}</td><td>${x.on?'<span class="pill ok">on</span>':'<span class="pill">off</span>'}</td><td style="white-space:nowrap"><button class="btn o sm" onclick="moveCms('music',${i},-1)">↑</button> <button class="btn o sm" onclick="moveCms('music',${i},1)">↓</button> <button class="btn o sm" onclick="editMusic(${i})">Edit</button> <button class="btn o sm" onclick="toggleCms('music',${i})">${x.on?'Disable':'Enable'}</button> <button class="btn d sm" onclick="deleteCms('music',${i})">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="card empty">No tracks yet. Add your first track.</div>'}`}
function editMusic(i){const x=i===undefined?{title:'',artist:'',text:'',cover:'',audio:'',on:true}:S.cms.music[i];const m=modal(`<h1 style="font-size:24px">${i===undefined?'Add':'Edit'} track</h1><br>${cmsField('Track title','cm1',x.title)}${cmsField('Artist','cm2',x.artist)}${fileBox('Audio URL','cm6','cm7','.mp3,audio/mpeg,audio/mp3',x.audio,'https://…mp3')}<div class="k" style="margin:-6px 0 10px;text-transform:none;letter-spacing:0">Choose an MP3 above to upload it (up to 40 MB). It replaces the URL.</div>${fileBox('Cover image URL','cm4','cm5','image/*',x.cover)}<div class="f"><label>Visibility</label><select id="cm8"><option value="1" ${x.on?'selected':''}>Visible</option><option value="0" ${x.on?'':'selected'}>Hidden</option></select></div><div id="cmMsg" class="k" style="text-transform:none;letter-spacing:0;margin-bottom:8px"></div><div class="pg"><i id="cmPg"></i></div><br><div class="bar"><button class="btn o" onclick="close(this)">Cancel</button><button class="btn" id="cmSave">Save track</button></div>`,true);
const q=s=>m.querySelector(s),say=(t,b)=>{q('#cmMsg').textContent=t;q('#cmMsg').style.color=b?'var(--bad)':''};
q('#cmSave').onclick=async()=>{const title=q('#cm1').value.trim();if(!title)return toast('Enter track title');const btn=q('#cmSave'),f1=q('#cm5').files[0],f2=q('#cm7').files[0];if(f2&&!/\.mp3$/i.test(f2.name)&&!/audio\/(mpeg|mp3)/.test(f2.type))return say('Please choose an MP3 file.',1);
const n={...x,title,artist:q('#cm2').value.trim(),cover:q('#cm4').value.trim(),audio:q('#cm6').value.trim(),on:q('#cm8').value==='1'};if(!n.audio&&!f2)return say('Add an MP3 file or an audio URL.',1);btn.disabled=true;
try{if(f2){say('Uploading MP3…');n.audio=await up1(f2,'music',p=>q('#cmPg').style.width=p+'%')}if(f1){say('Uploading cover…');q('#cmPg').style.width='0';n.cover=await up1(f1,'music-covers',p=>q('#cmPg').style.width=p+'%')}}catch(e){say('Upload failed: '+(e.message||e),1);btn.disabled=false;return}
const old=i===undefined?null:S.cms.music[i];if(i===undefined)S.cms.music.push(n);else S.cms.music[i]=n;say('Saving…');if(!(await save())){if(i===undefined)S.cms.music.pop();else S.cms.music[i]=old;say('Could not save. Uploaded files are kept; press Save to retry.',1);btn.disabled=false;return}m.remove();render();toast('Track saved')}}

function banners(){const L=S.cms.banners;return `<h1>Banner Manager</h1><p class="lead">Every banner used on the storefront. Desktop and mobile images are saved separately.</p><div class="bar"><button class="btn" onclick="editBanner()">+ Add banner</button><button class="btn o" onclick="refreshData(this)">Reload</button><span class="k">${L.length} banners</span></div>${L.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))">${L.map((x,i)=>`<div class="card"><div class="k">${x.slot==='gender'?'Home tile':'Sale banner'} · #${i+1}</div><div class="bp"><div><div class="k">Desktop</div>${bimg(x.imageDesktop)}</div><div><div class="k">Mobile</div>${bimg(x.imageMobile||x.image)}</div></div><b>${esc(x.title||'Untitled banner')}</b><p style="margin:2px 0">${esc(x.subtitle||'')}</p><small style="color:var(--muted)">${x.on?'Visible':'Hidden'} · ${esc(x.link||'no link')}</small><div class="bar" style="margin-top:10px"><button class="btn o sm" onclick="moveCms('banners',${i},-1)">↑</button><button class="btn o sm" onclick="moveCms('banners',${i},1)">↓</button><button class="btn o sm" onclick="editBanner(${i})">Edit</button><button class="btn o sm" onclick="toggleCms('banners',${i})">${x.on?'Disable':'Enable'}</button><button class="btn d sm" onclick="deleteCms('banners',${i})">Delete</button></div></div>`).join('')}</div>`:'<div class="card empty">No banners yet.</div>'}`}
function editBanner(i){const x=i===undefined?{slot:'sale',title:'',subtitle:'',imageDesktop:'',imageMobile:'',image:'',button:'Shop now',link:'#/collection/sale',headingSize:48,on:true}:S.cms.banners[i];const m=modal(`<h1 style="font-size:24px">${i===undefined?'Add':'Edit'} banner</h1><br><div class="f"><label>Placement</label><select id="bn0"><option value="sale" ${x.slot!=='gender'?'selected':''}>Sale banner (full-width)</option><option value="gender" ${x.slot==='gender'?'selected':''}>Home tile (Shop Women / Men)</option></select></div>${cmsField('Heading','bn1',x.title)}${cmsField('Subtitle','bn2',x.subtitle)}${fileBox('Desktop image URL','bn3','bn4','image/*',x.imageDesktop)}${fileBox('Mobile image URL','bn9','bn10','image/*',x.imageMobile||x.image)}<div class="r2">${cmsField('Button text','bn5',x.button)}${cmsField('Destination link','bn6',x.link,'text','#/collection/sale')}</div><div class="f"><label style="text-transform:none;letter-spacing:0;color:var(--ink);font-size:12px"><input type="checkbox" id="bn11" ${x.showText?'checked':''} style="width:auto"> Show heading, subtitle and button over the image (leave off if the image already contains text)</label></div><div class="f"><label>Visibility</label><select id="bn8"><option value="1" ${x.on?'selected':''}>Visible</option><option value="0" ${x.on?'':'selected'}>Hidden</option></select></div><div id="bnMsg" class="k" style="text-transform:none;letter-spacing:0;margin-bottom:8px"></div><div class="pg"><i id="bnPg"></i></div><br><div class="bar"><button class="btn o" onclick="close(this)">Cancel</button><button class="btn" id="bnSave">Save banner</button></div>`,true);
const q=s=>m.querySelector(s),say=(t,b)=>{q('#bnMsg').textContent=t;q('#bnMsg').style.color=b?'var(--bad)':''};
q('#bnSave').onclick=async()=>{const btn=q('#bnSave'),n={...x,slot:q('#bn0').value,title:q('#bn1').value.trim(),subtitle:q('#bn2').value.trim(),imageDesktop:q('#bn3').value.trim(),imageMobile:q('#bn9').value.trim(),button:q('#bn5').value.trim(),link:q('#bn6').value.trim(),showText:q('#bn11').checked,on:q('#bn8').value==='1'},fd_=q('#bn4').files[0],fm=q('#bn10').files[0];btn.disabled=true;
try{if(fd_){say('Uploading desktop image…');q('#bnPg').style.width='0';n.imageDesktop=await up1(fd_,'banners',p=>q('#bnPg').style.width=p+'%')}if(fm){say('Uploading mobile image…');q('#bnPg').style.width='0';n.imageMobile=await up1(fm,'banners',p=>q('#bnPg').style.width=p+'%')}}catch(e){say('Upload failed: '+(e.message||e),1);btn.disabled=false;return}
if(!n.imageDesktop&&!n.imageMobile){say('Add at least one image (desktop or mobile).',1);btn.disabled=false;return}n.image=n.imageMobile||n.imageDesktop;
const old=i===undefined?null:S.cms.banners[i];if(i===undefined)S.cms.banners.push(n);else S.cms.banners[i]=n;say('Saving…');if(!(await save())){if(i===undefined)S.cms.banners.pop();else S.cms.banners[i]=old;say('Could not save. Uploaded images are kept; press Save to retry.',1);btn.disabled=false;return}m.remove();render();toast('Banner saved')}}
function categories(){const L=S.cms.categories;return `<h1>Categories</h1><p class="lead">Create image-based category tiles for your website and three-line menu.</p><div class="bar"><button class="btn" onclick="editCategory()">+ Add category</button></div>${L.length?`<div class="tw"><table><tr><th>Image</th><th>Name</th><th>Link</th><th>Status</th><th></th></tr>${L.map((x,i)=>`<tr><td>${x.image?`<img class="pimg" src="${esc(x.image)}" alt="">`:''}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.link||'')}</td><td>${x.on?'Visible':'Hidden'}</td><td><button class="btn o sm" onclick="editCategory(${i})">Edit</button> <button class="btn d sm" onclick="deleteCms('categories',${i})">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="card empty">No categories added.</div>'}`}
function editCategory(i){const x=i===undefined?{name:'',image:'',link:'',on:true}:S.cms.categories[i];const m=modal(`<h1 style="font-size:24px">${i===undefined?'Add':'Edit'} category</h1><br>${cmsField('Category name','ct1',x.name)}${cmsField('Image URL','ct2',x.image,'url','https://…')}<div class="f"><label>Or upload image (max 2 MB)</label><input id="ct3" type="file" accept="image/*"></div>${cmsField('Menu / collection link','ct4',x.link,'text','/collections/women')}<div class="f"><label>Visible</label><select id="ct5"><option value="1" ${x.on?'selected':''}>Yes</option><option value="0" ${x.on?'':'selected'}>No</option></select></div><div class="bar"><button class="btn o" onclick="close(this)">Cancel</button><button class="btn" id="ctSave">Save category</button></div>`,true);m.querySelector('#ctSave').onclick=()=>{if(!m.querySelector('#ct1').value.trim())return toast('Enter category name');const n={name:m.querySelector('#ct1').value.trim(),image:m.querySelector('#ct2').value.trim()||x.image,link:m.querySelector('#ct4').value.trim(),on:m.querySelector('#ct5').value==='1'};const f=m.querySelector('#ct3').files[0],done=()=>{if(i===undefined)S.cms.categories.push(n);else S.cms.categories[i]=n;save();m.remove();render();toast('Category saved')};if(f)cmsUpload(f,v=>{n.image=v;done()});else done()}}
function reviews(){const L=S.cms.reviews;return `<h1>Reviews</h1><p class="lead">Manage genuine customer review cards and visibility.</p><div class="bar"><button class="btn" onclick="editReview()">+ Add review</button></div>${L.length?`<div class="tw"><table><tr><th>Customer</th><th>Rating</th><th>Review</th><th>Status</th><th></th></tr>${L.map((x,i)=>`<tr><td><b>${esc(x.name)}</b></td><td>${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</td><td>${esc(x.text)}</td><td>${x.on?'Visible':'Hidden'}</td><td><button class="btn o sm" onclick="editReview(${i})">Edit</button> <button class="btn d sm" onclick="deleteCms('reviews',${i})">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="card empty">No reviews yet.</div>'}`}
function editReview(i){const x=i===undefined?{name:'',rating:5,text:'',product:'',on:true}:S.cms.reviews[i];const m=modal(`<h1 style="font-size:24px">${i===undefined?'Add':'Edit'} review</h1><br>${cmsField('Customer display name','rv1',x.name)}${cmsField('Product (optional)','rv2',x.product)}<div class="f"><label>Rating</label><select id="rv3">${[5,4,3,2,1].map(n=>`<option value="${n}" ${n===x.rating?'selected':''}>${n} star${n===1?'':'s'}</option>`).join('')}</select></div><div class="f"><label>Review text</label><textarea id="rv4" rows="4">${esc(x.text)}</textarea></div><div class="f"><label>Visible</label><select id="rv5"><option value="1" ${x.on?'selected':''}>Yes</option><option value="0" ${x.on?'':'selected'}>No</option></select></div><div class="bar"><button class="btn o" onclick="close(this)">Cancel</button><button class="btn" id="rvSave">Save review</button></div>`,true);m.querySelector('#rvSave').onclick=()=>{const n={name:m.querySelector('#rv1').value.trim(),product:m.querySelector('#rv2').value.trim(),rating:+m.querySelector('#rv3').value,text:m.querySelector('#rv4').value.trim(),on:m.querySelector('#rv5').value==='1'};if(!n.name||!n.text)return toast('Enter customer name and review text');if(i===undefined)S.cms.reviews.unshift(n);else S.cms.reviews[i]=n;save();m.remove();render();toast('Review saved')}}
function branding(){const x=S.cms.branding;return `<h1>Branding & Text</h1><p class="lead">Set logo, announcement, heading and text sizes.</p><div class="card" style="max-width:650px"><h3>Logo and top announcement</h3>${cmsField('Logo image URL','br1',x.logo,'url','https://…')}<div class="f"><label>Or upload logo (max 2 MB)</label><input id="br2" type="file" accept="image/*"></div>${cmsField('Top announcement / offer text','br3',x.announcement)}${cmsField('Main heading text','br4',x.heading)}<div class="r2"><div class="f"><label>Heading size (px)</label><input id="br5" type="number" min="16" max="100" value="${x.headingSize||48}"></div><div class="f"><label>Body size (px)</label><input id="br6" type="number" min="10" max="32" value="${x.bodySize||14}"></div></div><div id="brPreview" style="padding:18px;border:1px solid var(--line);margin:12px 0"><div class="k">Preview</div><div id="brLogoPreview">${x.logo?`<img src="${esc(x.logo)}" style="max-height:60px;max-width:180px" alt="Logo">`:'CAVALLOLUXE'}</div><div id="brHeadingPreview" style="font-size:${x.headingSize||48}px;font-weight:900">${esc(x.heading||'Your heading text')}</div><div id="brBodyPreview" style="font-size:${x.bodySize||14}px">${esc(x.announcement||'Announcement text')}</div></div><div class="bar"><button class="btn" id="brSave">Save branding</button></div></div>`}
function pgData(id){const d=PAGE_DEFS.find(x=>x[0]===id),s=S.cms.pages[id]||{},has=!!(s.content&&String(s.content).trim());return{id,title:(s.title&&s.title.trim())||d[1],content:has?s.content:PAGE_DEFAULTS[id],custom:has,at:s.updatedAt}}
function pages(){return `<h1>Pages</h1><p class="lead">Edit the pages linked from the storefront footer. Text only: blank line = new paragraph, "## " = heading, "- " = bullet list.</p><div class="bar"><button class="btn o" onclick="refreshData(this)">Reload</button></div><div class="tw"><table><tr><th>Page</th><th>Content</th><th>Updated</th><th></th></tr>${PAGE_DEFS.map(([id])=>{const p=pgData(id);return`<tr><td><b>${esc(p.title)}</b><br><small style="color:var(--muted)">#/page/${id}</small></td><td>${p.custom?'<span class="pill ok">custom</span>':'<span class="pill">default text</span>'}</td><td>${p.at?fd(p.at):'—'}</td><td style="white-space:nowrap"><button class="btn o sm" onclick="editPage('${id}')">Edit</button></td></tr>`}).join('')}</table></div>`}

q('#pgP').onclick=()=>{const v=q('#pgPv');v.hidden=false;v.innerHTML='<h2 style="margin:0 0 8px">'+esc(q('#pg1').value)+'</h2>'+pgHtml(q('#pg2').value)};
q('#pgR').onclick=async()=>{if(!confirm('Remove your saved text and use the default text?'))return;delete S.cms.pages[id];if(await save()){m.remove();render();toast('Page reset')}};
q('#pgS').onclick=async()=>{const t=q('#pg1').value.trim(),c=q('#pg2').value.trim();if(!t||!c)return toast('Title and content are required');const old=S.cms.pages[id];S.cms.pages[id]={title:t,content:c,updatedAt:Date.now()};if(!(await save())){if(old)S.cms.pages[id]=old;else delete S.cms.pages[id];return}m.remove();render();toast('Page saved. It is live on the storefront.')}}
function deleteCms(k,i){if(!confirm('Delete this item?'))return;S.cms[k].splice(i,1);save();render()}

const MS=$('#msgs');let chat=[],busy=false;
function say(t,u){const d=document.createElement('div');d.className='m'+(u?' u':'');d.style.whiteSpace='pre-wrap';d.textContent=t;MS.appendChild(d);MS.scrollTop=1e9;return d}
async function aiCall(body){const user=fAuth.currentUser;if(!user)throw new Error('Please sign in again.');const token=await user.getIdToken();const r=await fetch('https://cavalloluxe-cl-ai.mbshort000.workers.dev',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({...body,storeContext:{products:S.products,orders:S.orders,coupons:S.coupons,cms:S.cms}})});let j={};try{j=await r.json()}catch(e){}if(!r.ok&&!j.error)j.error='AI service error ('+r.status+'). Deploy the Firebase clAi function.';return j}
function typeOut(d,t){return new Promise(r=>{let i=0;const k=()=>{i=Math.min(t.length,i+2);d.textContent=t.slice(0,i);MS.scrollTop=1e9;i<t.length?setTimeout(k,14):r()};k()})}
async function send(t){if(busy)return;busy=true;say(t,1);chat.push({role:'user',content:t});const d=say('Thinking…');d.style.opacity='.6';let j;try{j=await aiCall({messages:chat})}catch(e){d.remove();chat.pop();busy=false;return say('I could not reach the AI service. Check your connection and that the cl-ai function is deployed. Nothing was changed.')}
d.style.opacity='';if(j.error){d.textContent=j.error;chat.pop();busy=false;return}d.textContent='';await typeOut(d,j.reply);chat.push({role:'assistant',content:j.reply});if(j.navigate)go(j.navigate);(j.pending||[]).forEach(card);busy=false}
function card(a){const d=say('Needs your confirmation:\n'+a.summary),b=document.createElement('div');b.style.cssText='margin-top:8px;display:flex;gap:6px';b.innerHTML='<button class="btn sm">Confirm</button><button class="btn o sm">Cancel</button>';d.appendChild(b);
const fin=async ok=>{b.querySelectorAll('button').forEach(x=>x.disabled=true);let r;try{r=await aiCall(ok?{confirm:a.id}:{cancel:a.id})}catch(e){b.querySelectorAll('button').forEach(x=>x.disabled=false);return say('Could not reach the AI service. Nothing was confirmed. Try again.')}b.remove();const msg=r.error||r.message||'No response',txt=ok?((r.ok?'Done: ':'Failed: ')+msg):msg;say(txt);chat.push({role:'assistant',content:'[Result of "'+a.summary+'"] '+txt});if(r.changed)await refetch(true);if(r.navigate)go(r.navigate)};b.children[0].onclick=()=>fin(true);b.children[1].onclick=()=>fin(false)}
const SUG=['Which products are out of stock?','Show today\'s orders','How much revenue this week?','Find products under ₹2,000'];
function hello(){MS.innerHTML='';chat=[];say('Hi, I\'m CL AI. Ask me about your products, stock, orders, coupons, sales, or how to use this panel. I can analyse your store data and explain what to do, but I cannot make changes for you. Use the admin controls to save changes.');$('#chips').innerHTML=SUG.map(s=>`<button type="button">${esc(s)}</button>`).join('')}
$('#chips').onclick=e=>{if(e.target.tagName==='BUTTON')send(e.target.textContent)};
$('#aiF').onsubmit=e=>{e.preventDefault();const i=$('#aiI'),t=i.value.trim();if(!t)return;i.value='';send(t)};
$('#ai').onclick=()=>{$('#aip').classList.toggle('o');if($('#aip').classList.contains('o'))$('#aiI').focus()};$('#aiX').onclick=()=>$('#aip').classList.remove('o');$('#aiClear').onclick=hello;
$$('.nav').forEach(b=>b.onclick=()=>go(b.dataset.v));
/* ---------- Firebase shared cloud data layer ---------- */
let fq=Promise.resolve(true),inflight=0,rtOn=false,storeListener=null;
function setSync(t,bad){const e=$('#sync');if(e){e.textContent=t;e.style.color=bad?'var(--bad)':''}}
function objFromArray(arr,key){const o={};(arr||[]).forEach(x=>{if(x&&x[key]!=null)o[String(x[key])]=x});return o}
function seedProducts(){return PRODUCTS.map((p,i)=>({...p,desc:'',imgs:p.img?[p.img]:[],cols:[],flags:'nm',sort:i}))}
function save(){inflight++;setSync('Saving…');fq=fq.then(async()=>{try{const data={products:objFromArray(S.products,'id'),orders:objFromArray(S.orders,'id'),coupons:objFromArray(S.coupons,'code'),stockMoves:S.moves||[],cms:S.cms||{},seq:S.seq||100001,updatedAt:firebase.database.ServerValue.TIMESTAMP};await fdb.ref('store').update(JSON.parse(JSON.stringify(data)));setSync('All changes saved');return true}catch(e){setSync('Not saved',1);toast('Not saved: '+(e.message||e)+'. Check Firebase rules and connection.');return false}}).finally(()=>{inflight--});return fq}
async function refetch(force){if(!fAuth.currentUser)return;const a=document.activeElement;if(!force&&(inflight||document.querySelector('.ov')||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))))return;try{const snap=await fdb.ref('store').once('value');let d=snap.val()||{};if(!d.products||!Object.keys(d.products).length){d.products=objFromArray(seedProducts(),'id');await fdb.ref('store/products').set(d.products)}S.products=Object.values(d.products||{}).filter(Boolean).map(p=>{p.imgs=toArr(p.imgs).filter(Boolean);p.cols=toArr(p.cols);return p});S.orders=Object.values(d.orders||{}).filter(Boolean).map(o=>{o.items=toArr(o.items);o.history=toArr(o.history);o.collections=toArr(o.collections);o.notes=toArr(o.notes);o.name=o.name||'';o.phone=o.phone||'';o.method=o.method||'cod';o.status=o.status||'pending';return o}).sort((x,y)=>(y.at||0)-(x.at||0));S.coupons=Object.values(d.coupons||{});S.moves=Array.isArray(d.stockMoves)?d.stockMoves:Object.values(d.stockMoves||{});S.seq=Number(d.seq||100001);S.cms=d.cms||S.cms;cmsInit();lastLoad=Date.now();const seeded=seedCms();setSync('Connected · Firebase');render();if(seeded)save()}catch(e){setSync('Load failed',1);toast('Could not load Firebase data: '+(e.message||e))}}
function seedCms(){const c=S.cms;let ch=false;if(!c.bannersV2){DEFAULT_BANNERS.forEach((d,k)=>{const m=c.banners.find(b=>b.title===d.title);if(m){if(!m.imageDesktop)m.imageDesktop=d.imageDesktop;if(!m.imageMobile)m.imageMobile=m.image||d.imageMobile;if(!m.slot)m.slot=d.slot}else c.banners.push(JSON.parse(JSON.stringify(d)))});c.bannersV2=true;c.bannersSeeded=true;ch=true}
c.banners.forEach(b=>{if(!b.slot){b.slot='sale';ch=true}if(!b.imageMobile&&b.image){b.imageMobile=b.image;ch=true}});
if(!c.musicSeeded){if(!c.music.length)c.music=JSON.parse(JSON.stringify(DEFAULT_MUSIC));c.musicSeeded=true;ch=true}return ch}
function loginUI(msg){let d=$('#lg');if(!d){d=document.createElement('div');d.id='lg';d.className='ov c';d.style.background='var(--paper)';document.body.appendChild(d)}d.innerHTML=`<form class="md" id="lgF"><h1 style="font-size:26px">CavalloLuxe Admin</h1><p class="lead">Sign in with your Firebase admin account.</p><div class="f"><label>Email</label><input id="lg1" type="email" autocomplete="username" required></div><div class="f"><label>Password</label><input id="lg2" type="password" autocomplete="current-password" required></div><p id="lgE" style="color:var(--bad);min-height:18px;margin:0 0 10px">${esc(msg||'')}</p><button class="btn" style="width:100%" id="lgB">Sign in</button></form>`;$('#lgF').onsubmit=async e=>{e.preventDefault();$('#lgB').disabled=true;try{await fAuth.signInWithEmailAndPassword($('#lg1').value.trim(),$('#lg2').value)}catch(err){$('#lgE').textContent=err.message;$('#lgB').disabled=false}}}
async function boot(){const user=fAuth.currentUser;if(!user)return loginUI();$('#main').innerHTML='<div class="ld">Loading your store data…</div>';try{const adm=await fdb.ref('admins/'+user.uid).once('value');if(adm.val()!==true&&!(adm.val()&&adm.val().role==='admin')){await fAuth.signOut();return loginUI('This Firebase account is not authorised. Add its UID under /admins with value true.')}const lg=$('#lg');if(lg)lg.remove();await refetch(true);go('dashboard');if(!rtOn){rtOn=true;storeListener=fdb.ref('store').on('value',()=>{if(!inflight&&!document.querySelector('.ov'))refetch(false)});}}catch(e){console.error(e);$('#main').innerHTML='<div class="err"><b>Could not load the dashboard.</b><br>'+esc(e.message||e)+'<br><br><button class="btn" onclick="boot()">Try again</button></div>'}}
let authSeen=false;fAuth.onAuthStateChanged(user=>{authSeen=true;if(user)boot();else loginUI()});setTimeout(()=>{if(!authSeen)loginUI('Could not reach Firebase. Check your connection and refresh.')},12000);
hello();
</script></body></html>
